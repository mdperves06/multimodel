# Production override. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker/docker-compose.prod.yml up -d --build
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, a cloud load balancer) in front of the
# frontend on port 3000. Secure cookies and HSTS assume HTTPS.
x-prod-env: &prod-env
  ENVIRONMENT: production
  ENABLE_MOCK_PROVIDER: "false"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS to your public hostname(s)}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your public https origin}

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}

  redis:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      <<: *prod-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/ai_control_center

  worker:
    environment:
      <<: *prod-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/ai_control_center

  frontend:
    ports:
      - "127.0.0.1:3000:3000"
